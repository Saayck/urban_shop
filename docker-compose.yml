version: '3.8'

# Toda la configuracion viene del archivo .env de esta carpeta (ver .env.example).
# La sintaxis ${VAR:?mensaje} aborta el arranque si la variable falta, para que
# ningun secreto quede con un valor por defecto silencioso.

services:
  postgres:
    image: postgres:16-alpine
    container_name: urban_shop_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urban_shop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-urban_shop_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_shop_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-urban_shop_dev}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}

      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: ${JWT_ISSUER:-urban-shop-backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?define PAYMENT_WEBHOOK_SECRET en .env}
      PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}

      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      STORAGE_LOCATION: ${STORAGE_LOCATION:-/app/uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-10MB}

      BOOTSTRAP_SUPER_ADMIN_ENABLED: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:-false}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      BOOTSTRAP_SUPER_ADMIN_FULL_NAME: ${BOOTSTRAP_SUPER_ADMIN_FULL_NAME:-Super Administrador}
    volumes:
      - backend_uploads:${STORAGE_LOCATION:-/app/uploads}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
