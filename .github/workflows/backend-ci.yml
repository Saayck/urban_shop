name: Backend CI

on:
  push:
    branches: [main, dev_backend]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev_backend]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Una PR con varios pushes seguidos cancela las ejecuciones anteriores.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compilar y correr tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compilar y ejecutar la suite
        run: ./mvnw --batch-mode verify

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn

      - name: Publicar los resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

  migrations:
    name: Validar migraciones contra PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Los tests usan H2 con Flyway desactivado, asi que una migracion rota no se
    # detectaria ahi. Este job la aplica contra un PostgreSQL real y ademas verifica
    # que las entidades JPA validen contra el esquema resultante.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urban_shop_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Empaquetar sin tests
        run: ./mvnw --batch-mode package -DskipTests

      - name: Arrancar la aplicacion y comprobar el health check
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/urban_shop_ci
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci-password
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
        run: |
          java -jar target/backend-0.0.1-SNAPSHOT.jar --server.port=8080 &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "La aplicacion arranco: migraciones aplicadas y entidades validadas."
              kill $APP_PID
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "La aplicacion murio durante el arranque."
              exit 1
            fi
            sleep 2
          done
          echo "Timeout esperando a que la aplicacion quede lista."
          kill $APP_PID 2>/dev/null
          exit 1
