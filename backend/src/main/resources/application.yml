server:
  port: 8080

logging:
  pattern:
    # [correlationId] permite seguir todas las lineas de una misma peticion.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

spring:
  application:
    name: urban-shop-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urban_shop_dev}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Falla rapido en vez de dejar la peticion colgada esperando conexion.
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 600000
      # Avisa en el log de transacciones que retienen la conexion demasiado tiempo.
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:20000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
        jdbc:
          "[time_zone]": UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  issuer: ${JWT_ISSUER:urban-shop-backend}

app:
  # Con mail.enabled=false los correos se escriben en el log en lugar de enviarse por SMTP.
  mail:
    enabled: ${MAIL_ENABLED:false}

  cache:
    # Caduca por escritura: acota la ventana de datos obsoletos si se despliegan
    # varias instancias, porque @CacheEvict solo limpia la JVM local.
    ttl-seconds: ${CACHE_TTL_SECONDS:120}
    max-entries: ${CACHE_MAX_ENTRIES:2000}

  rate-limit:
    # OJO: el contador vive en memoria de cada instancia. Con N replicas el limite
    # efectivo es N x requests-per-minute. Ajustalo dividiendo por el numero de replicas,
    # o muevelo a Redis si necesitas un limite global exacto.
    requests-per-minute: ${RATE_LIMIT_RPM:15}

  storage:
    location: ${STORAGE_LOCATION:uploads}

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  webhook:
    payment:
      # Secreto compartido con la pasarela. Sin el, /api/payments/webhook rechaza todo.
      secret: ${PAYMENT_WEBHOOK_SECRET:}
      tolerance-seconds: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:300}

  bootstrap:
    super-admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_SUPER_ADMIN_FULL_NAME:Super Administrador}

management:
  endpoints:
    web:
      exposure:
        # prometheus queda fuera del acceso publico (ver SecurityConfig): solo health e info
        # son anonimos; metrics y prometheus exigen rol SUPER_ADMIN.
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      # Expone /actuator/health/liveness y /actuator/health/readiness para
      # los probes de Kubernetes, Cloud Run y similares.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
